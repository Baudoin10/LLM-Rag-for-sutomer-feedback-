<!DOCTYPE html>
<html>
<head>
    <title>Murakoze AI Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
        #chat { border: 1px solid #ccc; padding: 15px; height: 400px; overflow-y: auto; margin-bottom: 10px; }
        .user { color: blue; margin: 8px 0; }
        .assistant { color: green; margin: 8px 0; }
        #question { width: 80%; padding: 8px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <h2>Ask about the feedback</h2>
    <div id="chat"></div>
    <input type="text" id="question" placeholder="Type your question...">
    <button onclick="sendQuestion()">Send</button>

    <script>
        async function sendQuestion() {
            const input = document.getElementById("question");
            const question = input.value;
            if (!question) return;

            const chat = document.getElementById("chat");
            chat.innerHTML += `<div class="user"><b>You:</b> ${question}</div>`;
            input.value = "";

            const response = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question })
            });
            const data = await response.json();

            chat.innerHTML += `<div class="assistant"><b>Assistant:</b> ${data.answer}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById("question").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendQuestion();
        });
    </script>
</body>
</html>
